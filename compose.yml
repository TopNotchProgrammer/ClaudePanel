services:
  claude-panel:
    build: ./claude-panel
    container_name: claude-panel
    working_dir: /app/claude-panel
    volumes:
      - .:/app
      - ./claude:/home/node/.claude
      - ./claude.json:/home/node/.claude.json
      - ./claude-panel:/srv
    environment:
      CLAUDE_DIR: /home/node/.claude
      ANTHROPIC_MODEL: "claude-opus-5-5"
      PORT: "8080"
      TMUX_SOCKET: /tmp/cpa-tmux/default
      TMUX_TARGET: cpa-tmux
      UPLOADS_DIR: /app/claude-panel/uploads
      UPLOADS_CLAUDE_PATH: /app/claude-panel/uploads
      PANEL_LANG: pl
      PANEL_PASSWORD: ${PANEL_PASSWORD:-} # hasło do panelu — ustaw w .env obok compose.yml (PANEL_PASSWORD=...), poza gitem
      TLS_HOSTNAMES: "192.168.68.44,claude.topnotchprogrammer.com" # dodatkowe SAN-y certu (IP/hosty z LAN), po przecinku
    ports:
      - "8060:8080"
    stdin_open: true
    tty: true
    restart: unless-stopped
